# T3 Code's hub client uses these two legacy paths. Only this listener maps them
# to the device-authenticated handlers; private management keeps its original routes.
location = /v0/management/auth-files {
  limit_req zone=public_hub_reads burst=20 nodelay;
  limit_req_status 429;
  set $hub_backend proxy:8317;
  if ($request_method != GET) { return 405; }
  proxy_pass_request_headers off;
  proxy_set_header Authorization $http_authorization;
  proxy_pass http://$hub_backend/hermes-hub/auth-files;
}

location = /v0/management/api-call {
  limit_req zone=public_hub_reads burst=20 nodelay;
  limit_req_status 429;
  set $hub_backend proxy:8317;
  if ($request_method != POST) { return 405; }
  client_max_body_size 4k;
  proxy_pass_request_headers off;
  proxy_set_header Authorization $http_authorization;
  proxy_set_header Content-Type $content_type;
  proxy_pass http://$hub_backend/hermes-hub/api-call;
}
